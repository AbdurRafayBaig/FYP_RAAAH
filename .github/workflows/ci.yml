# Runs the checks of docs/TESTING.md on every push and pull request: unit and integration tests,
# the system tests in a browser against the running system, and the deployment images of Fig. 45.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    services:
      # Same image as the deployed database, so the PostGIS area check (FR-03.01) is exercised
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/raaah_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=optional
      - run: npm run test:coverage

  ai-engine:
    name: AI engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: System tests in the browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raaah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/raaah
      JWT_SECRET: ci-only-secret-for-the-system-tests-0123456789abcdef
      CORS_ORIGIN: http://localhost:3000
      AI_ENGINE_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - name: Install
        run: |
          npm --prefix backend ci --omit=optional
          npm --prefix frontend ci
          pip install -r ai-engine/requirements.txt
      - name: Database with the demo data
        working-directory: backend
        run: npm run db:migrate && npm run db:seed
      - name: Build the web client
        working-directory: frontend
        run: npm run build
      - name: Start the API, the AI engine and the web client
        run: |
          (cd backend && nohup node src/server.js > ../api.log 2>&1 &)
          (cd ai-engine && nohup python -m uvicorn app.main:app --port 8000 > ../ai.log 2>&1 &)
          (cd frontend && nohup npx next start -p 3000 > ../web.log 2>&1 &)
          for url in http://localhost:5000/api/health http://localhost:8000/health http://localhost:3000/; do
            for i in $(seq 1 60); do curl -fs "$url" > /dev/null && break; sleep 2; done
            curl -fs "$url" > /dev/null || { echo "$url did not start"; cat api.log ai.log web.log; exit 1; }
          done
      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: System tests
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        run: cat api.log ai.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    name: Deployment images (docker compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a trial deployment on localhost
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ciPassword2026/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 48)/" .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Demo data
        run: docker compose exec -T api node src/db/seed.js
      - name: The whole system answers through the HTTPS proxy
        run: |
          for i in $(seq 1 30); do curl -fsk https://localhost/ > /dev/null && break; sleep 2; done
          curl -fsk https://localhost/api/health | tee health.json; echo
          grep -q '"status":"ok"' health.json
          grep -q '"cache":"redis"' health.json
          grep -q '"postgis":true' health.json
          grep -q '"aiEngine":"up"' health.json
          curl -fsk https://localhost/ | grep -q 'RAAAH'
          curl -fsk https://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"tourist@raaah.pk","password":"Raaah@2026"}' | grep -q '"token"'
          # Only the proxy is reachable from outside (Deployment Diagram, Fig. 45)
          ! curl -fs --max-time 3 http://localhost:5000/api/health
          ! curl -fs --max-time 3 http://localhost:8000/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
